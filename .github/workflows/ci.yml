---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.6.7
  K8S_VERSION: 1.31.0

jobs:
  lint:
    name: Lint and schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.2

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Lint YAML
        run: |
          pip install --quiet yamllint
          yamllint --strict .

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Helm lint and kubeconform
        run: bash scripts/validate.sh

  deploy-test:
    name: Deploy to kind and run helm test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.2

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ci

      - name: Create namespaces with the restricted Pod Security Standard
        run: |
          for ns in web-dev web-prod; do
            kubectl create namespace "$ns"
            kubectl label namespace "$ns" \
              pod-security.kubernetes.io/enforce=restricted \
              pod-security.kubernetes.io/enforce-version=latest
          done

      - name: Install dev release
        run: |
          helm install web-service charts/web-service -n web-dev \
            -f environments/values-dev.yaml --wait --timeout 5m

      - name: Install prod release
        run: |
          helm install web-service charts/web-service -n web-prod \
            -f environments/values-prod.yaml --wait --timeout 5m

      - name: Run helm tests
        run: |
          helm test web-service -n web-dev --logs
          helm test web-service -n web-prod --logs

      - name: Upgrade with a configuration change and confirm a clean rollout
        run: |
          helm upgrade web-service charts/web-service -n web-prod \
            -f environments/values-prod.yaml --set content.message="Upgraded in CI" \
            --wait --timeout 5m
          kubectl -n web-prod rollout status deployment/web-service --timeout=3m
          helm test web-service -n web-prod --logs

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,events -A
          kubectl -n web-dev describe pods
          kubectl -n web-prod describe pods
