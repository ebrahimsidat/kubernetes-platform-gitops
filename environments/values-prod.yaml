# Production: highly available, autoscaled, exposed through the ingress controller.
replicaCount: 3

image:
  pullPolicy: IfNotPresent

content:
  title: "web-service"
  message: "Production environment. Deployed by Argo CD from a tagged release."

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    memory: 192Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  allowedNamespaces:
    - ingress-nginx

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: web.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: web-example-com-tls
      hosts:
        - web.example.com
